[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone for revision timestamps
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url is intentionally left blank here — migrations/env.py
# overrides it at runtime from Settings.DATABASE_URL (env var DATABASE_URL),
# so the same alembic.ini works locally and inside the api container.
sqlalchemy.url =


[post_write_hooks]
# no post-write hooks configured for this sprint

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
